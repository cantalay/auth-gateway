spring:
  application:
    name: auth-gateway
  mail:
    # Hoşgeldin maili için SMTP (Vault). SMTP_HOST boşsa gateway mail göndermez.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SSL:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

keycloak:
  base-url: ${KEYCLOAK_BASE_URL}
  # Default realm, served at /auth/* and /auth/{realm}/*. More realms: gateway.realms (GATEWAY_REALMS_<REALM>_*).
  realm: ${KEYCLOAK_REALM}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  client-id: ${KEYCLOAK_CLIENT_ID:auth}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  resource:
    attributes:
      service.name: ${OTEL_SERVICE_NAME:auth-gateway}
      service.namespace: ${POD_NAMESPACE:applications}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp

management:
  health:
    mail:
      # SMTP sorunları gateway'i NotReady yapmasın.
      enabled: false
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

