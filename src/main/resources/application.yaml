spring:
  application:
    name: auth-gateway
  mail:
    # Gateway e-postaları (hoş geldin, doğrulama, parola sıfırlama) için SMTP (Vault). SMTP_HOST boşsa gateway mail göndermez.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${SMTP_SSL:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

keycloak:
  base-url: ${KEYCLOAK_BASE_URL}
  # Default realm, served at /auth/* and /auth/{realm}/*. More realms: gateway.realms (GATEWAY_REALMS_<REALM>_*).
  realm: ${KEYCLOAK_REALM}
  issuer-uri: ${KEYCLOAK_ISSUER_URI:}
  client-id: ${KEYCLOAK_CLIENT_ID:auth}
  # Varsayılan realm'de login offline_access ister (ek realm'lerde GATEWAY_REALMS_<REALM>_OFFLINEACCESS).
  offline-access: ${KEYCLOAK_OFFLINE_ACCESS:false}
  # Varsayılan realm'de giriş yöntemi uçları: GET/DELETE /auth/identities, /social mode=link (ek realm'lerde
  # GATEWAY_REALMS_<REALM>_IDENTITYMETHODS). Kapalıyken bu uçlar 404 realm_feature_disabled, /social eskisi gibi.
  identity-methods: ${KEYCLOAK_IDENTITY_METHODS:false}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

gateway:
  action-token:
    # Parola sıfırlama / e-posta onay bağlantılarının HMAC anahtarları: "k2:<base64 32+ bayt>,k1:<...>" (ilki imzalar,
    # hepsi doğrular). Boşsa bu bağlantılar ve onlara bağlı realm özellikleri kapalı.
    secrets: ${GATEWAY_ACTION_TOKEN_SECRETS:}
    reset-ttl: 60m
    verify-ttl: 24h
  # Kayıt sınırı (tüm realm'ler; aşımda 429 rate_limited). Mobil operatör CGNAT'ında çok oyuncu tek IP paylaşabilir.
  register-limit:
    per-ip: ${GATEWAY_REGISTER_LIMIT_PER_IP:20}
    per-email: ${GATEWAY_REGISTER_LIMIT_PER_EMAIL:5}
  rate-limit:
    # Hız sınırı belleğinin üst sınırı (anahtar sayısı, LRU).
    max-keys: 50000

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL}
  resource:
    attributes:
      service.name: ${OTEL_SERVICE_NAME:auth-gateway}
      service.namespace: ${POD_NAMESPACE:applications}
  traces:
    exporter: otlp
  metrics:
    exporter: otlp
  logs:
    exporter: otlp

management:
  health:
    mail:
      # SMTP sorunları gateway'i NotReady yapmasın.
      enabled: false
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

