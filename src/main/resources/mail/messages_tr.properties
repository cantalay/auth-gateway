# Gateway e-postaları (Türkçe). Yer tutucular: {app} uygulama adı, {name} ad, {email} adres, {duration} bağlantı
# süresi, {providers} giriş sağlayıcıları, {support} destek adresi. Ek dil: messages_<dil>.properties, aynı anahtarlar.
greeting.named=Merhaba {name},
greeting.plain=Merhaba,
footer.automated=Bu e-posta otomatik gönderildi; lütfen yanıtlama.
footer.help=Yardım için {support} adresine yaz.
button.fallback=Düğme çalışmıyorsa bu bağlantıyı tarayıcında aç:
duration.minute.one={n} dakika
duration.minute.other={n} dakika
duration.hour.one={n} saat
duration.hour.other={n} saat
providers.or=ya da

welcome.subject=Hoş geldin — {app}
welcome.heading=Hoş geldin!
welcome.body={app} hesabın oluşturuldu, aramıza hoş geldin.
welcome.verify=E-posta adresini onaylaman için ayrı bir e-posta gönderdik. Bağlantıya dokunman yeter; gelmediyse uygulamadan yeniden gönderebilirsin.
welcome.button={app} uygulamasını aç
welcome.note=Bu hesabı sen oluşturmadıysan bu e-postayı yok sayabilirsin.

verify.subject={app} için e-postanı onayla
verify.heading=E-postanı onayla
verify.body={email} adresini onaylamak için düğmeye dokun. Bağlantı {duration} geçerli.
verify.button=E-postayı onayla
verify.note={app} hesabı açmadıysan bu e-postayı yok say.

reset.subject={app} parolanı sıfırla
reset.heading=Parolanı sıfırla
reset.body={email} hesabı için parola sıfırlama istendi. Yeni parolanı belirlemek için düğmeye dokun. Bağlantı {duration} geçerli ve tek kez çalışır.
reset.button=Yeni parola belirle
reset.note=Bu isteği sen yapmadıysan bu e-postayı yok say; parolan değişmez.

resetSocial.subject={app} hesabına giriş
resetSocial.heading=Bu hesabın parolası yok
resetSocial.body={email} hesabına {providers} ile giriş yapıyorsun; bu yüzden sıfırlanacak bir parola yok.
resetSocial.howto=Giriş ekranında "{providers} ile devam et" düğmesini kullan.
resetSocial.button={app} uygulamasını aç
resetSocial.note=Bu isteği sen yapmadıysan bu e-postayı yok sayabilirsin.

passwordChanged.subject={app} parolan değişti
passwordChanged.heading=Parolan değişti
passwordChanged.body={email} hesabının parolası az önce değiştirildi. Diğer cihazlar yeni parolayı soracak.
passwordChanged.warning=Bunu sen yapmadıysan hemen parolanı sıfırla.
passwordChanged.button=Parolamı sıfırla
passwordChanged.note=Bu değişikliği sen yaptıysan başka bir şey yapmana gerek yok.
