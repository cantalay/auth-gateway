# Gateway emails (English). Same keys as messages_tr.properties.
greeting.named=Hi {name},
greeting.plain=Hi,
footer.automated=This email was sent automatically; please do not reply.
footer.help=Need help? Write to {support}.
button.fallback=If the button doesn't work, open this link in your browser:
duration.minute.one={n} minute
duration.minute.other={n} minutes
duration.hour.one={n} hour
duration.hour.other={n} hours
providers.or=or

welcome.subject=Welcome to {app}
welcome.heading=Welcome!
welcome.body=Your {app} account is ready. Glad to have you.
welcome.verify=We sent you a separate email to confirm your address. Just tap the link; if it didn't arrive, you can send it again from the app.
welcome.button=Open {app}
welcome.note=If you didn't create this account, you can ignore this email.

verify.subject=Confirm your email for {app}
verify.heading=Confirm your email
verify.body=Tap the button to confirm {email}. The link works for {duration}.
verify.button=Confirm email
verify.note=If you didn't sign up for {app}, ignore this email.

reset.subject=Reset your {app} password
reset.heading=Reset your password
reset.body=Someone asked to reset the password of {email}. Tap the button to choose a new one. The link works for {duration} and only once.
reset.button=Choose a new password
reset.note=If you didn't ask for this, ignore this email; your password stays the same.

resetSocial.subject=Signing in to {app}
resetSocial.heading=This account has no password
resetSocial.body=You sign in to {email} with {providers}, so there is no password to reset.
resetSocial.howto=On the sign-in screen, use "Continue with {providers}".
resetSocial.button=Open {app}
resetSocial.note=If you didn't ask for this, you can ignore this email.

passwordChanged.subject=Your {app} password was changed
passwordChanged.heading=Your password was changed
passwordChanged.body=The password of {email} was just changed. Your other devices will ask for the new password.
passwordChanged.warning=If this wasn't you, reset your password right away.
passwordChanged.button=Reset my password
passwordChanged.note=If you made this change, there is nothing else to do.
