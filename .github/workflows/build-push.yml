name: verify-build-publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  java:
    uses: cantalay/talay-workflows/.github/workflows/java.yaml@d67ff4a3c7ebc578a96b8d79172bdaac892c4f63
    with:
      java-version: "17"
      build-tool: maven
      image-name: ghcr.io/cantalay/todogi-auth-gateway
      push-image: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      upload-sarif: false
